{% extends "base.html" %}

{% block title %}Create Ledger - VK LEDGUR CONVERTER{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1>Create New Ledger</h1>
        
        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" class="form">
            <div class="form-group">
                <label for="ledgerName">Ledger Name *</label>
                <input 
                    type="text" 
                    id="ledgerName" 
                    name="ledger_name" 
                    class="form-control" 
                    placeholder="e.g., General Ledger"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="accountName">Account Name</label>
                <input 
                    type="text" 
                    id="accountName" 
                    name="account_name" 
                    class="form-control" 
                    placeholder="e.g., Electricity Expense"
                >
            </div>
            
            <div class="form-group">
                <label for="accountNumber">Account Number</label>
                <input 
                    type="text" 
                    id="accountNumber" 
                    name="account_number" 
                    class="form-control" 
                    placeholder="e.g., 640"
                >
            </div>
            
            <div class="form-group">
                <label for="sheetNumber">Sheet Number</label>
                <input 
                    type="text" 
                    id="sheetNumber" 
                    name="sheet_number" 
                    class="form-control" 
                    placeholder="e.g., 21"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Create Ledger</button>
        </form>
        
        <p class="form-footer">
            <a href="/dashboard">← Back to Dashboard</a>
        </p>
    </div>
</div>
{% endblock %}
