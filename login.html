{% extends "base.html" %}

{% block title %}Login - VK LEDGUR CONVERTER{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1>Login</h1>
        <p class="form-subtitle">Access your ledgers</p>
        
        {% if errors %}
            <div class="alert alert-error">
                <strong>❌ Login Failed</strong>
                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
        
        <form method="POST" class="form">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter your username"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        
        <p class="form-footer">
            Don't have an account? <a href="/signup">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
